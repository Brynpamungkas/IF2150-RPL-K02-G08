# Database lokal KlimPooL (MySQL 8.4). Jalankan dari folder src/:
#   cp .env.example .env     (Windows PowerShell: Copy-Item .env.example .env)
#   docker compose up -d
# File di db/migrations/*.sql dijalankan otomatis berurutan saat volume masih kosong.
# Untuk mengulang dari nol (hapus data lalu seed ulang): docker compose down -v
services:
  db:
    image: mysql:8.4
    container_name: klimpool-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    # Port host default 3307 supaya tidak bentrok dengan MySQL/XAMPP lokal di 3306.
    ports:
      - '${DB_PORT:-3307}:3306'
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - klimpool-db-data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  klimpool-db-data:
